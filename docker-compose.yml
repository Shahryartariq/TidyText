services:
  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: tidytext:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # PORT in .env picks the host port above; inside, the app always uses 8000.
      PORT: "8000"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env (run: make env)}"
    restart: unless-stopped
    # Hardening: nothing in the app needs to write to disk or gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
