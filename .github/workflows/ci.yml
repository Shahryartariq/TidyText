name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make install PYTHON=python
      - run: make lint
      - run: make test
      - run: make check

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: make docker-build
      - name: Smoke test the container
        run: |
          docker run -d --name tidytext -p 8000:8000 --read-only --tmpfs /tmp \
            -e DJANGO_SECRET_KEY=ci-smoke-test-key tidytext:latest
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ | grep -q "Clean up messy text"
          docker logs tidytext
